name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Select toolchain
        run: rustup override set 1.95.0

      - name: Check tag matches Cargo.toml
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match Cargo.toml version $PKG" >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Stage executable and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/obs-video-trigger.exe dist/obs-video-trigger.exe
          cd dist
          sha256sum obs-video-trigger.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/obs-video-trigger.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
